name: Daily Finance Pipeline

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        env:
          INGESTION_SOURCE: ${{ secrets.INGESTION_SOURCE }}
          PLAID_CLIENT_ID: ${{ secrets.PLAID_CLIENT_ID }}
          PLAID_SECRET: ${{ secrets.PLAID_SECRET }}
          PLAID_ACCESS_TOKENS: ${{ secrets.PLAID_ACCESS_TOKENS }}
          PLAID_BASE_URL: ${{ secrets.PLAID_BASE_URL }}
          CSV_PATHS: ${{ secrets.CSV_PATHS }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MODEL_PATH: ${{ secrets.MODEL_PATH }}
          LABELED_DATASET_PATH: ${{ secrets.LABELED_DATASET_PATH }}
          ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: python main.py
